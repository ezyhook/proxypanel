# Пример конфига AmneziaWG (замените ключи, адрес и параметры на свои).
# Подходит экспорт из клиента Amnezia («Поделиться» → формат AmneziaWG / awg-quick) как есть:
# параметры Jc, Jmin, Jmax, S1…S4, H1…H4, I1…I5 должны совпадать с сервером.
# Панель сама выставит [Socks5]/[http] BindAddress по port/http_port из proxies.yaml.

[Interface]
Address = 10.8.1.2/32
PrivateKey = CFWSbBS/z2hwXFVDNgcUkNZSRRhbwkYNf7YQrgAhjGA=   # пример — замените своим
DNS = 1.1.1.1
Jc = 4
Jmin = 40
Jmax = 70
S1 = 52
S2 = 76
H1 = 1820461437
H2 = 512371092
H3 = 1137802413
H4 = 2063945151

[Peer]
PublicKey = hzqUmbOnlVYjTHdSrYI6PQ1mvZupFGrUyzLsKAdx73U=
Endpoint = awg-nl.example.com:51820
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
# PresharedKey = ...   # если есть в экспорте — оставьте
