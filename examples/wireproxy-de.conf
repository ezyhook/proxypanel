# Пример конфига wireproxy (замените ключи и адрес на свои).
# Панель сама:
#   * выставит [Socks5]/[http] BindAddress по port/http_port из proxies.yaml
#   * при obfuscator: направит Endpoint на локальный wg-obfuscator, а реальный адрес
#     сервера отдаст обфускатору как target
# Вместо этого можно явно написать {port} и {obfs} — тогда панель только подставит значения.

[Interface]
Address = 10.66.0.2/32
PrivateKey = CFWSbBS/z2hwXFVDNgcUkNZSRRhbwkYNf7YQrgAhjGA=   # пример — замените своим
DNS = 1.1.1.1
# обфускатор с masking STUN добавляет байты к пакетам — MTU лучше уменьшить
MTU = 1380

[Peer]
PublicKey = hzqUmbOnlVYjTHdSrYI6PQ1mvZupFGrUyzLsKAdx73U=
Endpoint = vps-de.example.com:19999
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
# PresharedKey = <wg genpsk>   # если на сервере для этого пира задан PresharedKey

# [Socks5] / [http] не нужны: порты задаются в proxies.yaml (port / http_port),
# панель допишет секции сама. Если оставите их тут — без port в proxies.yaml порт возьмётся отсюда.
